name: Scrapers TCE (Paralelo por Ano)

on:
  workflow_dispatch: 

jobs:
  scrape_data:
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        estado: [rj, rs] # Nomes dos seus scripts: webscraper_rj.py, webscraper_rs.py
        ano: ['2020', '2021', '2022', '2023', '2024', '2025'] # Os anos que deseja baixar

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 selenium

      # Summary: Runs the script passing the matrix year as an environment variable
      - name: Run Scraper ${{ matrix.estado }} - Ano ${{ matrix.ano }}
        env:
          TARGET_YEAR: ${{ matrix.ano }}
        working-directory: Scrapers/
        run: python webscraper_${{ matrix.estado }}.py

      # Summary: Uploads a specific zip file for each state and year
      - name: Upload Data Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dados_TCE_${{ matrix.estado }}_${{ matrix.ano }}
          path: Scrapers/Dados_*/
          retention-days: 7
