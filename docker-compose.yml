# Ambiente reprodutível do banco analítico (SQL Server 2025 Developer).
#
#   docker compose up -d      sobe o banco e cria o schema na primeira execução
#   docker compose down       para os containers (os dados ficam no volume mssql-data)
#
# Lê DB_PASSWORD e DB_PORT do arquivo .env (ver .env.example).

name: tcc-remuneracao

x-mssql: &mssql
  # Tag fixa (17.0.4065.4): mesma versão em que o banco do TCC 1 foi carregado.
  image: mcr.microsoft.com/mssql/server:2025-CU7-ubuntu-24.04
  environment: &mssql-env
    ACCEPT_EULA: "Y"
    MSSQL_PID: Developer
    MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    SQLCMDPASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}

services:
  sqlserver:
    <<: *mssql
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q 'SELECT 1' > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # Execução única: aplica schema.sql somente se o banco ainda não existir,
  # pois o script faz DROP DATABASE e apagaria uma carga já feita.
  db-init:
    <<: *mssql
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./schema.sql:/scripts/schema.sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        SQLCMD="/opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -C -b"
        EXISTE=$$($$SQLCMD -h -1 -W -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM sys.databases WHERE name = 'remuneracao_tce'")
        if [ "$$EXISTE" = "0" ]; then
          echo "Banco remuneracao_tce inexistente: aplicando schema.sql"
          $$SQLCMD -i /scripts/schema.sql
        else
          echo "Banco remuneracao_tce já existe: schema.sql não foi aplicado"
        fi
    restart: "no"

volumes:
  mssql-data:
